# Grafana dashboard, as-code. The Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard in this namespace. Authored against real awstest series.
# The JSON below is the single source of truth — edit here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pavo-tribal-dashboard
  namespace: pavo-observability
  labels:
    grafana_dashboard: "1"
data:
  tribal.json: |
    {
      "uid": "pavo-svc-tribal",
      "title": "Pavo \u2014 Tribal-knowledge",
      "tags": [
        "pavo",
        "service",
        "tribal"
      ],
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "timezone": "",
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Instance namespace",
            "description": "Omnistrate instance namespace(s) on this cell. All = every instance-* namespace, so single-instance cells need no selection.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "regex": "/^instance-.*/",
            "refresh": 1,
            "sort": 1,
            "includeAll": true,
            "allValue": "instance-.*",
            "multi": false,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Service",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Tribal pods running",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",pod=~\"pavo-tribal.*\",phase=\"Running\"})",
              "legendFormat": "Tribal pods running",
              "refId": "A"
            }
          ]
        },
        {
