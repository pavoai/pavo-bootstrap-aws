          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(onboarding_orchestrator_health_checks_total[5m]))",
              "legendFormat": "checks/s",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Resources",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "id": 8,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU cores by container",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 9,
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"instance-836t09q9s\",pod=~\"pavo-onboarding.*\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{container}}",
              "refId": "A"
