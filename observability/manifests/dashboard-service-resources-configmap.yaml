              "expr": "topk(10, 100 * sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) / sum by (pod)(container_spec_cpu_quota{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}/container_spec_cpu_period{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"} > 0))",
