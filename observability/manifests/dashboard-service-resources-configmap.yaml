          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))",
              "legendFormat": "Restarts (1h, app ns)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU cores by service",
