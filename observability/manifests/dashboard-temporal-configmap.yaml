# Grafana dashboard, as-code. The Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard in this namespace. The JSON below is the single source of
# truth — edit here.
#
# Only meaningful on cells with temporal_mode=self_hosted; elsewhere every
# panel is empty (harmless). Queries follow temporalio/dashboards + the LLD's
# SLO targets (StartWorkflowExecution p95 < 150ms, schedule-to-start p95
# < 150ms, shard lock latency < 1ms, throughput = state transitions/s).
# Worker SDK series (temporal_*) verified on instance-drys9yzpf; server-side
# series are unverified — validate against a live cell on first apply.
#
# "Shards owned" thresholds hardcode 128 (green only at 128). The value comes
# from the per-cell temporal_history_shards var; a cell created with a
# non-default shard count will show red here until the steps are updated
# (panel "Shards owned", fieldConfig.defaults.thresholds.steps).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pavo-temporal-dashboard
  namespace: pavo-observability
  labels:
    grafana_dashboard: "1"
data:
  temporal.json: |
    {
      "uid": "pavo-temporal",
      "title": "Pavo \u2014 Temporal (self-hosted)",
      "tags": [
        "pavo",
        "temporal",
        "infrastructure"
      ],
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "timezone": "",
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "type": "constant",
            "name": "pods",
            "hide": 2,
            "query": "(temporal-(frontend|history|matching|worker|web)|intern-temporal-workers)-.*",
            "description": "Pod-name regex for all Temporal server + intern worker workloads on the Infra row."
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "SLOs & throughput",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "State transitions /s (throughput)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(state_transition_count_sum[1m]))",
              "legendFormat": "state transitions/s",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Cluster-wide throughput in Temporal's native unit (state transitions/s) \u2014 the capacity metric the scaling guide keys on. Should track offered load linearly; a flattening ceiling while latencies rise = capacity limit."
        },
        {
          "type": "timeseries",
          "title": "SLO 1 \u2014 StartWorkflowExecution p95 (target < 150ms)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 3,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.15
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(service_latency_bucket{operation=\"StartWorkflowExecution\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(service_latency_bucket{operation=\"StartWorkflowExecution\"}[5m])))",
              "legendFormat": "p99",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Target: p95 < 150ms (scaling-blog SLO; blog measures it client-side, so server-side reads slightly lower). Emits only while starts occur \u2014 gaps mean no starts, not an outage."
        },
        {
          "type": "timeseries",
          "title": "SLO 2 \u2014 Schedule-to-start p95 (target < 150ms)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 4,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 150
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(temporal_workflow_task_schedule_to_start_latency_bucket[5m])))",
              "legendFormat": "workflow task p95",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_bucket[5m])))",
              "legendFormat": "activity p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Target: p95 < 150ms (SDK metric, milliseconds). Time a task waits before a worker picks it up \u2014 rising = workers starving, add workers/slots. Only emits when tasks are dispatched; under the load test this bursts at 20-min stage boundaries. Alert: TemporalScheduleToStartLatencySLO."
        },
        {
          "type": "timeseries",
          "title": "Workflow outcomes /min",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(increase(workflow_success[5m]))/5",
              "legendFormat": "success",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(increase(workflow_failed[5m]))/5",
              "legendFormat": "failed",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(increase(workflow_timeout[5m]))/5",
              "legendFormat": "timeout",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(increase(workflow_terminate[5m]))/5",
              "legendFormat": "terminated",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Terminal workflow outcomes. Expect success only; failed/timeout/terminate ~= 0. Cancels are normal and not plotted."
        },
        {
          "type": "timeseries",
          "title": "Resource exhausted /s (rps/concurrency limits)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (operation) (rate(service_errors_resource_exhausted[5m]))",
              "legendFormat": "{{operation}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Server shedding load via rps/concurrency dynamic-config limits. Expected: 0. Any sustained value = raise limits or scale the role. Alert: TemporalResourceExhausted."
        },
        {
          "type": "stat",
          "id": 37,
          "title": "Workflows running",
          "description": "Workflows currently running, from visibility CountWorkflowExecutions \u2014 published as pavo_running_workflows by the intern app's pending-activity monitor (~60s cadence). max across app replicas. Temporal exports no native metric for this; empty until an intern build with the gauge is deployed. Shows No data (not a stale number) when the count RPC has failed for >5m (pavo_running_workflows_last_publish_timestamp_seconds).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "expr": "max(pavo_running_workflows and (time() - pavo_running_workflows_last_publish_timestamp_seconds < 300))",
              "legendFormat": "running",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Server health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 7,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "gRPC requests /s by operation (top 10)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "topk(10, sum by (operation) (rate(service_requests[2m])))",
              "legendFormat": "{{operation}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Per-API request load on the frontend. Idle baseline is a few req/s from Temporal's internal system workers."
        },
        {
          "type": "timeseries",
          "title": "Service error ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 9,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(service_errors[5m])) / sum(rate(service_requests[5m]))",
              "legendFormat": "errors / requests",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Fraction of gRPC requests failing across all APIs. Expect ~0. Alert at >5% for 10m (our convention)."
        },
        {
          "type": "timeseries",
          "title": "Sync match rate \u2014 workflow vs activity",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 10,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(poll_success_sync{task_type=\"Workflow\"}[5m])) / sum(rate(poll_success{task_type=\"Workflow\"}[5m]))",
              "legendFormat": "workflow",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(rate(poll_success_sync{task_type=\"Activity\"}[5m])) / sum(rate(poll_success{task_type=\"Activity\"}[5m]))",
              "legendFormat": "activity",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Share of tasks handed directly to a waiting poller, skipping a persistence write. Scaling-blog target: >= 0.99 for both workflow and activity. Low = pollers scarce -> extra DB load and latency."
        },
        {
          "type": "timeseries",
          "title": "Tasks with no pollers /s (wrong task queue = silent hang)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.001
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (taskqueue) (rate(no_poller_tasks[5m]))",
              "legendFormat": "{{taskqueue}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Tasks arriving on a queue nobody polls \u2014 the wrong-task-queue-name failure mode; invisible to every other metric (schedule-to-start only records on pickup). Expected: 0. Alert: TemporalTaskQueueNoPollers."
        },
        {
          "type": "timeseries",
          "title": "Inter-role client errors /s (frontend<->history<->matching)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (operation) (rate(client_errors[5m]))",
              "legendFormat": "{{operation}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Errors on internal RPCs between frontend/history/matching. Expected ~0; brief spikes during rollouts (membership churn) are normal."
        },
        {
          "type": "row",
          "title": "History & shards",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "id": 13,
          "panels": [
            {
              "type": "timeseries",
              "title": "Shard lock latency p95 / p99",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "id": 14,
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 0,
                "y": 35
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "showPoints": "never",
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 0.001
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(lock_latency_bucket{operation=\"ShardInfo\"}[5m])))",
                  "legendFormat": "p95",
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  }
                },
                {
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(lock_latency_bucket{operation=\"ShardInfo\"}[5m])))",
                  "legendFormat": "p99",
                  "refId": "B",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  }
                }
              ],
              "description": "SLO: p95 < 1ms (internal \u2014 stricter than the scaling blog's 'under 5ms, ideally ~1ms'). Time to acquire a history shard lock; sustained rise = shard contention (shard count frozen at cluster create). Pager alert deliberately at p99 > 5ms \u2014 a healthy cell runs ~1ms p99, alerting at the SLO would flap."
            },
            {
              "type": "timeseries",
              "title": "History task latency p95 (queue vs processing)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "id": 15,
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 6,
                "y": 35
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "showPoints": "never"
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(task_latency_queue_bucket[5m])))",
                  "legendFormat": "queue p95",
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  }
                },
                {
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(task_latency_processing_bucket[5m])))",
                  "legendFormat": "processing p95",
                  "refId": "B",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  }
                }
              ],
              "description": "queue = end-to-end task latency from creation to completion (includes waits and retries); processing = single-attempt execution. Widening gap between them = tasks spending time waiting/retrying \u2014 history falling behind."
            },
            {
              "type": "timeseries",
              "title": "Shard movement /s (rebalancing churn)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "id": 16,
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 12,
                "y": 35
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "ops",
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "showPoints": "never"
