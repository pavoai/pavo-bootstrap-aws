# Grafana dashboard, as-code. The Grafana sidecar loads ConfigMaps labelled
# grafana_dashboard in this namespace. The JSON below is the single source of
# truth — edit here.
#
# Only meaningful on cells with temporal_mode=self_hosted; elsewhere every
# panel is empty (harmless). Queries follow temporalio/dashboards + the LLD's
# SLO targets (StartWorkflowExecution p95 < 150ms, schedule-to-start p95
# < 150ms, shard lock latency < 5ms, throughput = state transitions/s).
# Authored before the first self_hosted cell existed — validate series names
# against a live cell on first apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pavo-temporal-dashboard
  namespace: pavo-observability
  labels:
    grafana_dashboard: "1"
data:
  temporal.json: |
