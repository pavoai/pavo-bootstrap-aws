      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Instance namespace",
            "description": "Omnistrate instance namespace(s) on this cell. All = every instance-* namespace, so single-instance cells need no selection.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "regex": "/^instance-.*/",
            "refresh": 1,
            "sort": 1,
            "includeAll": true,
            "allValue": "instance-.*",
            "multi": false,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Agent throughput & outcomes",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Task completions /s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(pavo_task_completions_total[5m]))",
              "legendFormat": "Task completions /s",
              "refId": "A"
            }
          ]
        },
